[project]
name = "gmail-outreach-autoresponder"
version = "0.1.0"
description = "Auto-replies on Gmail threads when an Outreach prospect opens an email more than 2 times"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.120.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "httpx>=0.27.0",
    "apscheduler>=3.10.4",
    "python-dotenv>=1.0.1",
]

[tool.setuptools]
py-modules = ["main", "db", "outreach", "gmail_client", "nudger", "recap", "config"]
