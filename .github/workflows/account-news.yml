name: Account news digest

on:
  schedule:
    # 12:00 UTC ≈ 7am Central during DST, 6am Central in standard time.
    # Adjust to '0 13 * * *' if you prefer 7am Central year-round during CST.
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Materialize Gmail OAuth files from secrets
        env:
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          printf '%s' "$GMAIL_CREDENTIALS_JSON" > credentials.json
          printf '%s' "$GMAIL_TOKEN_JSON" > token.json

      - name: Run account-news pipeline
        env:
          SF_LOGIN_URL: ${{ secrets.SF_LOGIN_URL }}
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_CLIENT_SECRET: ${{ secrets.SF_CLIENT_SECRET }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
          SF_SECURITY_TOKEN: ${{ secrets.SF_SECURITY_TOKEN }}
          AE_OWNER_NAME: ${{ secrets.AE_OWNER_NAME }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          MANET_EMAIL: ${{ secrets.MANET_EMAIL }}
          NEWS_LOOKBACK_DAYS: "1"
          TIMEZONE: "America/Chicago"
          GMAIL_CREDENTIALS_PATH: "credentials.json"
          GMAIL_TOKEN_PATH: "token.json"
        run: |
          python account_news.py --verbose

      - name: Persist refreshed Gmail token (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gmail-token
          path: token.json
          if-no-files-found: ignore
          retention-days: 7
