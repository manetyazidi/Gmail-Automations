name: Daily Account News Digest

on:
  schedule:
    # 7:00 AM America/Chicago = 12:00 UTC (CST) / 13:00 UTC (CDT).
    # GitHub Actions cron is UTC-only; using 12:00 UTC means delivery is
    # 7am CST in winter, 8am CDT in summer. Adjust if you need strict 7am.
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e .

      - name: Write Gmail OAuth files
        env:
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          printf '%s' "$GMAIL_CREDENTIALS_JSON" > credentials.json
          printf '%s' "$GMAIL_TOKEN_JSON" > token.json

      - name: Run digest
        env:
          AE_EMAIL: ${{ secrets.AE_EMAIL }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_CLIENT_SECRET: ${{ secrets.SF_CLIENT_SECRET }}
          SF_REFRESH_TOKEN: ${{ secrets.SF_REFRESH_TOKEN }}
          SF_LOGIN_URL: ${{ secrets.SF_LOGIN_URL }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          NEWS_LOOKBACK_HOURS: "24"
        run: python account_news.py
